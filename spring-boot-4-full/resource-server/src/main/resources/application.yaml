server:
  port: 8082

spring:
  application:
    name: resource-server

  datasource:
    url: jdbc:mysql://localhost:3308/resourcedb?allowPublicKeyRetrieval=true&useSSL=false
    username: resourceuser
    password: resourcepw
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# No spring.security.oauth2.resourceserver.jwt.* here: common-security's
# ResourceServerSecurityConfig supplies its own JwtDecoder bean, built from
# the shared public key packaged in that module — no JWKS endpoint, no
# network dependency on auth-server being reachable at validation time.