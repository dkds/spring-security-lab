# spring-boot-4-full/auth-server/compose.yaml
#
# One-time setup for the shared network (see resource-server/compose.yaml):
#   docker network create lab-net
#
# Run:  docker compose up -d
# Stop: docker compose down          (data survives)
#       docker compose down -v && rm -rf .data   (full reset)

name: lab-auth-server

services:
  auth-db:
    image: mysql:8.4
    container_name: lab-auth-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-authdb}
      MYSQL_USER: ${MYSQL_USER:-authuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-authpw}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lab-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: lab-auth-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP — auth-server sends here
      - "${MAILPIT_UI_PORT:-8025}:8025"     # Web UI — view emails in browser
    networks:
      - lab-net

  # Phase 7 test SAML2 IdP. Realm/client/user are all defined in
  # ./docker/keycloak/lab-realm.json and imported automatically on first
  # boot (--import-realm), so the whole IdP side is reproducible from a
  # clean checkout — no manual admin-console setup, and safe to commit to
  # git (see that file's own notes on the fixed, lab-only RSA signing key).
  #
  # auth-server always runs as a plain process on localhost:9000 (in a
  # devcontainer or on the host — see devbox's README on port forwarding),
  # so the realm's SP redirect/ACS URL is hardcoded to http://localhost:9000
  # and works unchanged in both setups; only Keycloak's own address differs
  # (this compose file: localhost:8180 — the devbox devcontainer instead
  # runs its own separate Keycloak reachable at http://keycloak:8180, same
  # realm file). Do not run both stacks against the same host ports at once.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: lab-auth-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"   # http://localhost:8180 — admin console at /admin
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      - ./.data/keycloak:/opt/keycloak/data/h2
    networks:
      - lab-net

networks:
  lab-net:
    name: lab-net
    external: true

# ---------------------------------------------------------------------------
# Later, for the multi-instance experiment (Phase 8), add alongside auth-db:
#
#   auth-server:
#     build: .
#     deploy:
#       replicas: 2
#     environment:
#       SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authdb?...
#     depends_on:
#       auth-db:
#         condition: service_healthy
#     networks: [lab-net]
#
# Do not set container_name on that service — it prevents replicas.
# Note that the in-memory RSA signing key must be persisted first, or the two
# replicas will sign with different keys and reject each other's tokens.
# ---------------------------------------------------------------------------
