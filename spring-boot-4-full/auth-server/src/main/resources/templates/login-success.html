<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed In</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 0.9rem; line-height: 1.5; }
        .subtitle strong { color: #333; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✅</div>
    <h1>You're signed in</h1>
    <p class="subtitle">
        Signed in as <strong sec:authentication="name">your account</strong>.<br>
        This auth server has no dashboard of its own — return to the
        application that sent you here to continue.
    </p>
</div>
</body>
</html>
