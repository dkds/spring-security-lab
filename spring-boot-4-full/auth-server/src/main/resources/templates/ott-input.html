<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 0.5rem; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
        .error {
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .code-inputs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .code-inputs input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .code-inputs input:focus { border-color: #667eea; }
        input[type="hidden"] {}
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .resend {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #666;
        }
        .resend a { color: #667eea; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">📧</div>
    <h1>Check your email</h1>
    <p class="subtitle">We sent a 6-digit code to your email address.<br>Enter it below to continue.</p>

    <div th:if="${param.error}" class="error">
        Invalid or expired code. Please try again.
    </div>

    <!-- OTT submission form -->
    <form th:action="@{/login/ott}" method="post" id="ottForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="token" id="tokenHidden"/>

        <div class="code-inputs">
            <input type="text" inputmode="numeric" maxlength="1" class="digit" autofocus/>
            <input type="text" inputmode="numeric" maxlength="1" class="digit"/>
            <input type="text" inputmode="numeric" maxlength="1" class="digit"/>
            <input type="text" inputmode="numeric" maxlength="1" class="digit"/>
            <input type="text" inputmode="numeric" maxlength="1" class="digit"/>
            <input type="text" inputmode="numeric" maxlength="1" class="digit"/>
        </div>

        <button type="submit" class="btn">Verify</button>
    </form>

    <p class="resend">
        Didn't receive a code?
        <a th:href="@{/ott/request}">Resend</a>
    </p>
</div>

<script>
    // Auto-advance between digit inputs and compose full token on submit
    const digits = document.querySelectorAll('.digit');
    const hidden = document.getElementById('tokenHidden');

    digits.forEach((input, i) => {
        input.addEventListener('input', () => {
            input.value = input.value.replace(/\D/g, '').slice(-1);
            if (input.value && i < digits.length - 1) digits[i + 1].focus();
            updateHidden();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && i > 0) {
                digits[i - 1].focus();
            }
        });
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData)
                .getData('text').replace(/\D/g, '').slice(0, 6);
            pasted.split('').forEach((ch, j) => {
                if (digits[j]) digits[j].value = ch;
            });
            updateHidden();
            digits[Math.min(pasted.length, 5)].focus();
        });
    });

    function updateHidden() {
        hidden.value = Array.from(digits).map(d => d.value).join('');
    }

    document.getElementById('ottForm').addEventListener('submit', updateHidden);
</script>
</body>
</html>
