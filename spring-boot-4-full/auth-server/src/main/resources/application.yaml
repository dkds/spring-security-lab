server:
  port: 9000

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:mysql://localhost:3307/authdb?allowPublicKeyRetrieval=true&useSSL=false
    username: authuser
    password: authpw
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# OAuth2 authorization server settings.
# issuer must resolve to a URL reachable by the SPA and resource server.
app:
  security:
    # Signs the remember-me cookie / links a RememberMeAuthenticationProvider
    # to the RememberMeServices that issued a given token — not a secret
    # storing anything itself. A checked-in fixed value is a lab/POC-only
    # shortcut (same rationale as the JWT signing key); a real deployment
    # generates and rotates this per-environment.
    remember-me-key: lab-remember-me-key
  oauth2:
    issuer: http://localhost:9000
    spa-redirect-uri: http://localhost:5173/callback
    # Phase 8: where an IdP-initiated SAML login (no saved request) lands.
    # The SPA's own root is enough — RequireAuth.tsx fires signinRedirect()
    # the moment an unauthenticated visitor hits a protected route, which
    # starts a fresh authorization code request with PKCE on its own.
    spa-landing-uri: http://localhost:5173/
  saml:
    # Standalone compose (auth-server/compose.yaml) runs Keycloak on
    # localhost:8180. The devcontainer stack runs its own separate instance
    # at http://keycloak:8180 instead (see application-devpod.yaml) — same
    # realm file either way (auth-server/docker/keycloak/lab-realm.json),
    # only the address differs.
    keycloak-base-url: http://localhost:8180

logging:
  level:
    org.springframework.security: TRACE