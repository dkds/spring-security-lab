server:
  port: 9000

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:mysql://localhost:3307/authdb?allowPublicKeyRetrieval=true&useSSL=false
    username: authuser
    password: authpw
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# OAuth2 authorization server settings.
# issuer must resolve to a URL reachable by the SPA and resource server.
app:
  oauth2:
    issuer: http://localhost:9000
    spa-redirect-uri: http://localhost:5173/callback

logging:
  level:
    org.springframework.security: TRACE