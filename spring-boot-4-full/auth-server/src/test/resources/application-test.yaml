server:
  # Explicit even though it's Boot's default: no trusted reverse proxy fronts
  # this test environment, so a caller-supplied X-Forwarded-For must never be
  # honored. See OrgIpAuthorizationManager / SecurityConfig.
  forward-headers-strategy: none

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

  mail:
    host: localhost
    port: 1025
    from: noreply@test.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
